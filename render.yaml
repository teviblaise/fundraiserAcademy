services:
  - type: web
    name: fundraiser-academy-preview
    repo: https://github.com/teviblaise/fundraiserAcademy
    branch: preview/fundraiser-academy
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      # Render prompts securely during initial Blueprint setup. Existing
      # services must add this key in their own Environment settings.
      - key: TWELVE_DATA_API_KEY
        sync: false
      # Signup confirmation and password recovery use transactional Resend email.
      # Use a sender on a domain verified in Resend.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Exact initial owner email(s). Requires verified email and enrolled 2FA.
      # This does not create an account or bypass either security prerequisite.
      - key: ADMIN_OWNER_EMAILS
        sync: false
